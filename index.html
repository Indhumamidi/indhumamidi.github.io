<!DOCTYPE html>
<html>
<head>
    <title>My App</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.2);
            width: 300px;
        }

        h1 {
            color: #333;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: #4facfe;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #007bff;
        }
    </style>
</head>
<body>

<div class="card">
    <h1 id="text">How are you 😊</h1>
    <button onclick="changeText()">Click me</button>
</div>

<script>
    function changeText() {
        document.getElementById("text").innerHTML = "Hope you are doing great 🚀";
    }
</script>

</body>
</html>
