<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Web App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            padding: 15px;
            color: white;
            text-align: center;
            font-size: 20px;
        }

        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            width: 300px;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.2);
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            background: #5a67d8;
        }
    </style>
</head>

<body>



<div class="container">
    <div class="card">
        <h1 id="text">How are you 😊</h1>
        <button onclick="showMessage()">Click Me</button>
    </div>
</div>

<script>
    const messages = [
        "Hope you are doing great 🌟",
        "You are amazing just the way you are 💖",
        "Today is your day, make it awesome 🚀",
        "Keep smiling, it suits you 😊",
        "Believe in yourself, you can do anything 💪",
        "Stay positive and happy always 🌈"
    ];

    let index = 0;

    function showMessage() {
        document.getElementById("text").innerHTML = messages[index];
        index++;

        if (index >= messages.length) {
            index = 0; // restart messages
        }
    }
</script>

</body>
</html>
